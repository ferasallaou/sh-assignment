<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fd8"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><style>.band-label{font-size:12px;font-weight:700;letter-spacing:.08em}.t{font-size:14px;font-weight:600;fill:#1f2328}.s{font-size:12px;fill:#57606a}.edge-label{font-size:12px;fill:#57606a}</style></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="20" y="20" width="330" height="470" rx="14" fill="#f5f2ff" stroke="#6b4fd8" stroke-width="1.5"/><text class="band-label" x="38" y="44" fill="#6b4fd8">RECORD</text><text class="s" x="38" y="62">one item from a source</text><rect x="36" y="74" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="90.0" text-anchor="start">source · external_id</text><text class="s" x="48" y="107.0" text-anchor="start">where it came from (Salesforce, Jira, …)</text><rect x="36" y="122" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="138.0" text-anchor="start">title · content</text><text class="s" x="48" y="155.0" text-anchor="start">the text</text><rect x="36" y="170" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="186.0" text-anchor="start">fields</text><text class="s" x="48" y="203.0" text-anchor="start">typed fields from the data contract</text><rect x="36" y="218" width="298" height="40" rx="10" fill="#fff8f0" stroke="#d9822b" stroke-width="1.5"/><text class="t" x="48" y="234.0" text-anchor="start">allowed_groups</text><text class="s" x="48" y="251.0" text-anchor="start">who may see it · empty means no one</text><rect x="36" y="266" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="282.0" text-anchor="start">sensitivity · region</text><text class="s" x="48" y="299.0" text-anchor="start">internal, confidential · EU, NA</text><rect x="36" y="314" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="330.0" text-anchor="start">content_hash · record_hash</text><text class="s" x="48" y="347.0" text-anchor="start">did the text change? did anything change?</text><rect x="36" y="362" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="378.0" text-anchor="start">source_updated_at · synced_at</text><text class="s" x="48" y="395.0" text-anchor="start">so answers can say &quot;as of&quot;</text><rect x="36" y="410" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="48" y="426.0" text-anchor="start">one transaction per change</text><text class="s" x="48" y="443.0" text-anchor="start">text, chunks, links, permissions together</text><rect x="420" y="20" width="330" height="220" rx="14" fill="#f5f2ff" stroke="#6b4fd8" stroke-width="1.5"/><text class="band-label" x="438" y="44" fill="#6b4fd8">CHUNK</text><text class="s" x="438" y="62">a searchable piece of a record</text><rect x="436" y="74" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="448" y="90.0" text-anchor="start">content</text><text class="s" x="448" y="107.0" text-anchor="start">a few paragraphs of the record</text><rect x="436" y="122" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="448" y="138.0" text-anchor="start">keyword index</text><text class="s" x="448" y="155.0" text-anchor="start">finds exact words, names and IDs</text><rect x="436" y="170" width="298" height="40" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="448" y="186.0" text-anchor="start">embedding · embedding_model</text><text class="s" x="448" y="203.0" text-anchor="start">finds meaning; one model at a time</text><rect x="420" y="290" width="330" height="200" rx="14" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/><text class="band-label" x="438" y="314" fill="#2f6fde">LINK</text><text class="s" x="438" y="332">connects a record to an entity</text><rect x="436" y="344" width="298" height="40" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text class="t" x="448" y="360.0" text-anchor="start">relation</text><text class="s" x="448" y="377.0" text-anchor="start">requests · implements · describes · owns</text><rect x="436" y="392" width="298" height="40" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text class="t" x="448" y="408.0" text-anchor="start">matched_by</text><text class="s" x="448" y="425.0" text-anchor="start">id · alias · suggested · reviewed</text><rect x="436" y="440" width="298" height="40" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text class="t" x="448" y="456.0" text-anchor="start">confidence</text><text class="s" x="448" y="473.0" text-anchor="start">how sure we are about the link</text><rect x="820" y="290" width="240" height="200" rx="14" fill="#ecf8f1" stroke="#1f8a5b" stroke-width="1.5"/><text class="band-label" x="838" y="314" fill="#1f8a5b">ENTITY</text><text class="s" x="838" y="332">a shared business object</text><rect x="836" y="344" width="208" height="40" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="848" y="360.0" text-anchor="start">type</text><text class="s" x="848" y="377.0" text-anchor="start">feature · customer · team</text><rect x="836" y="392" width="208" height="40" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="848" y="408.0" text-anchor="start">key</text><text class="s" x="848" y="425.0" text-anchor="start">stable ID, e.g. dark-mode</text><rect x="836" y="440" width="208" height="40" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="848" y="456.0" text-anchor="start">name</text><text class="s" x="848" y="473.0" text-anchor="start">Dark mode</text><rect x="820" y="20" width="240" height="180" rx="14" fill="#ecf8f1" stroke="#1f8a5b" stroke-width="1.5"/><text class="band-label" x="838" y="44" fill="#1f8a5b">ALIASES</text><text class="s" x="838" y="62">other names people use</text><rect x="836" y="74" width="208" height="40" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="940.0" y="98.5" text-anchor="middle">&quot;night mode&quot;</text><rect x="836" y="122" width="208" height="40" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="940.0" y="146.5" text-anchor="middle">&quot;dark theme&quot;</text><polyline points="350,130 414,130" fill="none" stroke="#6b4fd8" stroke-width="2" marker-end="url(#purple)"/><text class="edge-label" x="382" y="122" text-anchor="middle">split into</text><polyline points="350,390 414,390" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#blue)"/><text class="edge-label" x="382" y="382" text-anchor="middle">has</text><polyline points="820,390 756,390" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#blue)"/><text class="edge-label" x="788" y="382" text-anchor="middle">has</text><polyline points="940,200 940,284" fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#green)"/><text class="edge-label" x="950" y="248" text-anchor="start">known as</text><text class="s" x="20" y="520">Permissions live only on the record (orange). Chunks inherit them, so one permission change applies to every chunk at once,</text><text class="s" x="20" y="538">and a change to permissions alone never needs the text split or embedded again.</text></svg>
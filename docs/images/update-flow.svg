<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fd8"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker><style>.band-label{font-size:12px;font-weight:700;letter-spacing:.08em}.t{font-size:14px;font-weight:600;fill:#1f2328}.s{font-size:12px;fill:#57606a}.edge-label{font-size:12px;fill:#57606a}</style></defs><rect width="1080" height="520" fill="#ffffff"/><rect x="20" y="20" width="1040" height="280" rx="14" fill="#ecf8f1" stroke="#1f8a5b" stroke-width="1.5"/><text class="band-label" x="38" y="44" fill="#1f8a5b">WHEN A RECORD CHANGES · within minutes</text><rect x="40" y="70" width="190" height="70" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text class="t" x="135.0" y="101.0" text-anchor="middle">1. Source</text><text class="s" x="135.0" y="118.0" text-anchor="middle">Jira says &quot;ENG-42 changed&quot;</text><polyline points="230,105 254,105" fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#green)"/><rect x="260" y="70" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="360.0" y="92.5" text-anchor="middle">2. Connector</text><text class="s" x="360.0" y="109.5" text-anchor="middle">fetches the current item:</text><text class="s" x="360.0" y="126.5" text-anchor="middle">text and permissions</text><polyline points="460,105 484,105" fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#green)"/><rect x="490" y="70" width="170" height="70" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="575.0" y="101.0" text-anchor="middle">3. Change queue</text><text class="s" x="575.0" y="118.0" text-anchor="middle">in order per record</text><polyline points="660,105 684,105" fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#green)"/><rect x="690" y="70" width="170" height="70" rx="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="1.5"/><text class="t" x="775.0" y="101.0" text-anchor="middle">4. Worker</text><text class="s" x="775.0" y="118.0" text-anchor="middle">compares fingerprints</text><rect x="880" y="70" width="160" height="70" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/><text class="t" x="960.0" y="92.5" text-anchor="middle">Why fetch?</text><text class="s" x="960.0" y="109.5" text-anchor="middle">events can be lost,</text><text class="s" x="960.0" y="126.5" text-anchor="middle">late or doubled</text><polyline points="775,140 775,160 560,160 560,184" fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#green)"/><polyline points="775,140 775,160 880,160 880,184" fill="none" stroke="#1f8a5b" stroke-width="2" marker-end="url(#green)"/><rect x="400" y="190" width="320" height="90" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="560.0" y="214.0" text-anchor="middle">Only permissions changed</text><text class="s" x="560.0" y="231.0" text-anchor="middle">update the record and its links</text><text class="s" x="560.0" y="248.0" text-anchor="middle">one transaction, seconds</text><text class="s" x="560.0" y="265.0" text-anchor="middle">no re-splitting, no new embeddings</text><rect x="740" y="190" width="300" height="90" rx="10" fill="#ffffff" stroke="#6b4fd8" stroke-width="1.5"/><text class="t" x="890.0" y="214.0" text-anchor="middle">The text changed</text><text class="s" x="890.0" y="231.0" text-anchor="middle">replace chunks, rebuild links</text><text class="s" x="890.0" y="248.0" text-anchor="middle">in one transaction,</text><text class="s" x="890.0" y="265.0" text-anchor="middle">then add embeddings separately</text><text class="s" x="40" y="214">A reader never sees new text</text><text class="s" x="40" y="231">with old permissions: each change</text><text class="s" x="40" y="248">is saved all at once or not at all.</text><rect x="20" y="320" width="1040" height="170" rx="14" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/><text class="band-label" x="38" y="344" fill="#2f6fde">EVERY NIGHT · catches deletions no one reported</text><rect x="40" y="370" width="300" height="90" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text class="t" x="190.0" y="402.5" text-anchor="middle">1. List the source</text><text class="s" x="190.0" y="419.5" text-anchor="middle">every ID and fingerprint</text><text class="s" x="190.0" y="436.5" text-anchor="middle">that exists right now</text><polyline points="340,415 374,415" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#blue)"/><rect x="380" y="370" width="300" height="90" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text class="t" x="530.0" y="402.5" text-anchor="middle">2. Compare with the store</text><text class="s" x="530.0" y="419.5" text-anchor="middle">anything missing from the source</text><text class="s" x="530.0" y="436.5" text-anchor="middle">was deleted there</text><polyline points="680,415 714,415" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#blue)"/><rect x="720" y="370" width="320" height="90" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="1.5"/><text class="t" x="880.0" y="394.0" text-anchor="middle">3. Delete it here too</text><text class="s" x="880.0" y="411.0" text-anchor="middle">record, chunks and links go together</text><text class="s" x="880.0" y="428.0" text-anchor="middle">an empty export is refused, never</text><text class="s" x="880.0" y="445.0" text-anchor="middle">treated as &quot;delete everything&quot;</text></svg>
# Local PostgreSQL with the pgvector extension.
# Host port 5433 avoids clashing with a PostgreSQL already running on 5432.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowledge -d knowledge']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:

# Mock identities and access rules.
#
# In production: users and groups come from the company login (SSO, e.g. Okta),
# agents are registered service identities, and keys are real secrets.
# Here they are plain strings so the demo is easy to run.
#
# Access rule: a record is visible only if BOTH
#   1. the agent's scope allows its source, AND
#   2. the user is in at least one of the record's allowed_groups.
# Records with no allowed_groups are denied to everyone (deny by default).

agents:
  - id: roadmap-agent
    description: Helps decide what to build next (priorities, demand, effort and trade-offs) using Sales, Engineering and Product data.
    api_key: dev-agent-roadmap
    allowed_sources: [sales, engineering, product]
    allowed_tools: [search_knowledge, get_feature_context]
    # The router may send users in these groups to this agent.
    offered_to_groups: [product, sales, engineering]

  # A narrower agent: Product documents only, and no feature lookup. It also shows that
  # tool visibility and source scope depend on the calling agent, not only on the user.
  - id: product-faq-agent
    description: Answers quick factual questions about product documents, like what the dark mode brief or the feedback digest says. Not for deciding what to build.
    api_key: dev-agent-product-faq
    allowed_sources: [product]
    allowed_tools: [search_knowledge]
    offered_to_groups: [product, sales, engineering]

  # Answers HR questions. Its scope is HR documents only, plus live lookups in the HR system:
  # leave (own balance only) and salary (own, or anyone's for the hr group; checked by the MCP service).
  - id: hr-agent
    description: Answers HR questions - HR policies, leave and vacation days, salary and pay.
    api_key: dev-agent-hr
    allowed_sources: [hr]
    allowed_tools: [search_knowledge, get_leave_balance, get_salary]
    offered_to_groups: [product, sales, engineering, hr]

users:
  - id: paula
    name: Paula (Product Manager)
    token: dev-user-paula
    groups: [product]

  - id: sam
    name: Sam (Account Executive)
    token: dev-user-sam
    groups: [sales]

  # Sees engineering tickets and the shared product brief, but no customer deals
  # and not the Product-only roadmap draft.
  - id: eli
    name: Eli (Engineer)
    token: dev-user-eli
    groups: [engineering]

  # Signed in but not in any group yet, so every lookup comes back empty.
  # Proves that a valid login alone gives no access.
  - id: nina
    name: Nina (New hire, no groups yet)
    token: dev-user-nina
    groups: []

  # HR team: may see colleagues' pay through the HR agent, and the HR-only salary bands.
  - id: hana
    name: Hana (HR Business Partner)
    token: dev-user-hana
    groups: [hr]
